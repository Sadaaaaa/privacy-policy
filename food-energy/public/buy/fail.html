<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment failed — Food Energy</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #0E1410;
    --bg-card: #1C2A22;
    --fg: #F2F8F4;
    --fg-sec: #93A39B;
    --fg-muted: #62736A;
    --accent: #34C759;
    --error: #FF6B6B;
    --border: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100vh;
  }
  body {
    background-image:
      radial-gradient(circle at 50% 0%, rgba(255,107,107,0.18), transparent 60%);
    background-attachment: fixed;
  }
  a { color: var(--accent); }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 80px 20px 60px;
    text-align: center;
  }
  .icon {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: var(--error);
    color: #0E1410;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 800;
    margin: 0 auto 24px;
  }
  h1 { font-size: 26px; font-weight: 800; margin-bottom: 12px; }
  p { color: var(--fg-sec); margin-bottom: 12px; font-size: 15px; }

  .retry-btn {
    display: inline-block;
    background: var(--accent);
    color: #0E1410;
    padding: 14px 28px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    margin-top: 24px;
  }

  .footer {
    color: var(--fg-muted);
    font-size: 12px;
    margin-top: 40px;
  }
</style>
</head>
<body>
<div class="wrap">

<div class="icon">!</div>

<h1 data-i18n="title">Payment failed</h1>
<p data-i18n="lead">Your card wasn't charged. The bank declined the transaction or you cancelled the payment.</p>
<p data-i18n="lead2">No worries — try again or use a different card.</p>

<a href="/buy" class="retry-btn" data-i18n="retry">Try again</a>

<div class="footer" data-i18n-html="footer">
  Issues? <a href="mailto:sergmochalin@gmail.com">sergmochalin@gmail.com</a>
</div>

</div>

<script>
const I18N = {
  en: {
    title: 'Payment failed',
    lead: "Your card wasn't charged. The bank declined the transaction or you cancelled the payment.",
    lead2: 'No worries — try again or use a different card.',
    retry: 'Try again',
    footer: 'Issues? <a href="mailto:sergmochalin@gmail.com">sergmochalin@gmail.com</a>',
  },
  ru: {
    title: 'Оплата не прошла',
    lead: 'С карты ничего не списано. Банк отклонил операцию или вы отменили платёж.',
    lead2: 'Не страшно — попробуйте ещё раз или другой картой.',
    retry: 'Попробовать снова',
    footer: 'Проблемы? <a href="mailto:sergmochalin@gmail.com">sergmochalin@gmail.com</a>',
  },
};
function detectLang() {
  try {
    const s = localStorage.getItem('lang');
    if (s === 'en' || s === 'ru') return s;
  } catch (_) {}
  return (navigator.language || 'en').toLowerCase().startsWith('ru') ? 'ru' : 'en';
}
const lang = detectLang();
const T = I18N[lang];
document.documentElement.lang = lang;
document.querySelectorAll('[data-i18n]').forEach((el) => {
  if (T[el.dataset.i18n]) el.innerHTML = T[el.dataset.i18n];
});
document.querySelectorAll('[data-i18n-html]').forEach((el) => {
  if (T[el.dataset.i18nHtml]) el.innerHTML = T[el.dataset.i18nHtml];
});
</script>

</body>
</html>
