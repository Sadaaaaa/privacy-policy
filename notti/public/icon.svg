<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1A8"/>
      <stop offset="100%" stop-color="#F2D26A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fridge surface -->
  <rect width="256" height="256" rx="56" fill="#F6F2EC"/>

  <!-- Sticky note slightly rotated -->
  <g transform="rotate(-4 128 128)" filter="url(#shadow)">
    <rect x="56" y="56" width="144" height="144" rx="14" fill="url(#paper)"/>
    <!-- Lines suggesting text -->
    <rect x="76" y="92"  width="92" height="8" rx="4" fill="#2E2A24" opacity="0.7"/>
    <rect x="76" y="116" width="104" height="8" rx="4" fill="#2E2A24" opacity="0.55"/>
    <rect x="76" y="140" width="68" height="8" rx="4" fill="#2E2A24" opacity="0.4"/>
    <!-- Checkbox -->
    <circle cx="80" cy="172" r="9" fill="none" stroke="#2E2A24" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Small magnet dot -->
  <circle cx="128" cy="46" r="9" fill="#E8B86A"/>
  <circle cx="128" cy="46" r="3.5" fill="#FFF" opacity="0.6"/>
</svg>
